name: Publier SPORT Web · WEB041

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "functions/**"
      - "firebase.functions.json"
      - "scripts/deploy_strava_backend.sh"
      - ".github/workflows/web.yml"
      - "docs/releases/WEB041.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "sport-web-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Valider WEB041
        shell: bash
        run: |
          set -euxo pipefail
          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js

          grep -Fq "WEB018 · SYNCHEALTH001" web/index.html
          grep -Fq "Santé de la synchronisation" web/index.html
          grep -Fq "syncHealthRetryButton" web/index.html

          grep -Fq 'WEB_PENDING_MUTATIONS_KEY' web/app.js
          grep -Fq 'function startSyncHealthWatch' web/app.js
          grep -Fq 'function publishWebHealth' web/app.js
          grep -Fq 'function flushPendingWebMutations' web/app.js
          grep -Fq 'function commitWebMutationOnline' web/app.js
          grep -Fq '"sync_health"' web/app.js
          grep -Fq 'webVersion: "WEB041"' web/app.js

          # WEB022 · WEBCARTO007.
          grep -Fq "WEB020 · WEBCARTO005" web/index.html
          grep -Fq 'mapRouteModeSelect' web/index.html
