name: WEB046 - WEBACTIVITY002 navigateur

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Appliquer WEB046 WEBACTIVITY002
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          
          const appFile = 'web/app.js';
          const indexFile = 'web/index.html';
          let app = fs.readFileSync(appFile, 'utf8');
          let html = fs.readFileSync(indexFile, 'utf8');
          
          function fail(message, code=20) {
            console.error('ERREUR : ' + message);
            process.exit(code);
          }
          
          // WEB046 · WEBACTIVITY002
          // 1) L'onglet Activités se suffit à lui-même : masquer son grand hero.
          const navNeedle = 'uxCurrentPage = page;\n  uxCurrentSubpage = sub;';
          if (app.includes(navNeedle) && !app.includes('document.body.classList.toggle("ux-activities-page"')) {
            app = app.replace(
              navNeedle,
              navNeedle + '\n  document.body.classList.toggle("ux-activities-page", page === "activities");'
            );
          } else if (!app.includes('document.body.classList.toggle("ux-activities-page"')) {
            fail('point de navigation Activités introuvable', 20);
          }
          
          // 2) Compacteur d'interface : en-tête du répertoire supprimé, boutons de chargement en bas,
          //    barre navigation + résumé activité réunis dans une pile sticky.
          const ui46 = `
          // -----------------------------------------------------------------------------
          // WEB046 · WEBACTIVITY002 — dépouillement Activités + détail sticky
          // -----------------------------------------------------------------------------
          function upgradeActivityUiWeb046() {
            const directory = document.getElementById("activityDirectorySection");
            if (directory) {
              const header = directory.querySelector(":scope > .panel-title-row");
              const activityList = document.getElementById("activityList");
              if (header && activityList && !directory.querySelector(".directory-load-actions-bottom")) {
                const actions = header.querySelector(".panel-actions");
                if (actions) {
                  const bottom = document.createElement("div");
                  bottom.className = "directory-load-actions-bottom";
                  bottom.append(...Array.from(actions.children));
                  activityList.insertAdjacentElement("afterend", bottom);
                }
                header.remove();
              }
            }
          
            const detail = document.getElementById("detailView");
            if (detail && !detail.querySelector(":scope > .detail-sticky-stack")) {
              const toolbar = detail.querySelector(":scope > .detail-toolbar");
              const hero = detail.querySelector(":scope > .detail-hero-two-lines");
              if (toolbar && hero) {
                const stack = document.createElement("div");
                stack.className = "detail-sticky-stack";
                toolbar.insertAdjacentElement("beforebegin", stack);
                stack.append(toolbar, hero);
              }
            }
          
            const oldInterop = document.querySelector(".hero-actions .interop-badge");
            if (oldInterop) oldInterop.remove();
          }
          `;
          
          if (!app.includes('function upgradeActivityUiWeb046()')) {
            const marker = 'function uxPageConfig() {';
            const pos = app.indexOf(marker);
            if (pos < 0) fail('point insertion WEB046 introuvable', 21);
            app = app.slice(0, pos) + ui46 + '\n' + app.slice(pos);
          }
          
          if (!app.includes('upgradeActivityUiWeb046();')) {
            const marker = 'upgradeActivityDirectoryUi();';
            const pos = app.indexOf(marker);
            if (pos >= 0) {
              app = app.slice(0, pos + marker.length) + '\nupgradeActivityUiWeb046();' + app.slice(pos + marker.length);
            } else {
              const fallback = 'initializeWebStravaModule();';
              const fpos = app.indexOf(fallback);
              if (fpos < 0) fail('appel initialisation WEB046 introuvable', 22);
              app = app.slice(0, fpos + fallback.length) + '\nupgradeActivityUiWeb046();' + app.slice(fpos + fallback.length);
            }
          }
          
          // 3) Icône lisible + date/heure comme une vraie donnée du bandeau.
          const iconStart = app.indexOf('function activitySportIcon(activity) {');
          const datumStart = app.indexOf('function datum(', iconStart);
          if (iconStart < 0 || datumStart < 0) fail('bloc activité WEB045 introuvable', 23);
          
          const activityBlock = `function activitySportIconMarkup(activity) {
            const code = Number(activity?.sport);
            if (code === 1) {
              return '<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="30" cy="7.5" r="4.2"></circle><path d="M25 15l-8 8 7 5 4-8 8 5"></path><path d="M23.5 28L15 42"></path><path d="M24.5 28L35 40"></path><path d="M17 23l-8 5"></path></svg>';
            }
            if (code === 2) {
              return '<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="12" cy="35" r="8"></circle><circle cx="36" cy="35" r="8"></circle><path d="M12 35l9-16h8l7 16"></path><path d="M21 19l8 16"></path><path d="M18 27h14"></path><path d="M20 15h7"></path></svg>';
            }
            if (code === 5) return '<span class="activity-icon-fallback">🏊</span>';
            if (code === 11 || code === 17) return '<span class="activity-icon-fallback">🥾</span>';
            return '<span class="activity-icon-fallback">●</span>';
          }
          
          function formatActivityStart(value) {
            const date = dateFromMs(value);
            if (!date) return "—";
            const day = new Intl.DateTimeFormat("fr-FR", {
              day: "2-digit", month: "2-digit", year: "numeric"
            }).format(date);
            const time = new Intl.DateTimeFormat("fr-FR", {
              hour: "2-digit", minute: "2-digit"
            }).format(date);
            return \`\${day} · \${time}\`;
          }
          
          function activityMain(activity) {
            const cell = document.createElement("div");
            cell.className = "activity-main activity-main-web046";
          
            const icon = document.createElement("span");
            icon.className = "activity-sport-icon activity-sport-icon-web046";
            icon.innerHTML = activitySportIconMarkup(activity);
            icon.setAttribute("aria-label", sportName(activity.sport));
            icon.title = sportName(activity.sport);
          
            cell.append(icon);
            return cell;
          }
          
          `;
          app = app.slice(0, iconStart) + activityBlock + app.slice(datumStart);
          
          const appendNeedle = 'button.appendChild(activityMain(activity));\n    button.appendChild(datum("Distance", formatDistance(activity.distance_m)));';
          const appendReplacement = 'button.appendChild(activityMain(activity));\n    button.appendChild(datum("Départ", formatActivityStart(activity.start_time_ms), "activity-start-datum"));\n    button.appendChild(datum("Distance", formatDistance(activity.distance_m)));';
          if (app.includes(appendNeedle)) {
            app = app.replace(appendNeedle, appendReplacement);
          } else if (!app.includes('datum("Départ", formatActivityStart(activity.start_time_ms), "activity-start-datum")')) {
            fail('insertion Départ dans renderActivities introuvable', 24);
          }
          
          // 4) Interopérabilité : un seul badge compact dans le topbar.
          if (!html.includes('id="interopCompactStatus"')) {
            const authMarker = '<span id="authState"';
            const pos = html.indexOf(authMarker);
            if (pos < 0) fail('authState introuvable dans index.html', 25);
            html = html.slice(0, pos) + '<span id="interopCompactStatus" class="pill ok hidden">Intéropérabilité OK</span>\n      ' + html.slice(pos);
          }
          
          const setMessageStart = app.indexOf('function setMessage(text, type) {');
          const setMetricStart = app.indexOf('function setMetric(', setMessageStart);
          if (setMessageStart < 0 || setMetricStart < 0) fail('fonction setMessage introuvable', 26);
          const newSetMessage = `function setMessage(text, type) {
            const interopBadge = document.getElementById("interopCompactStatus");
            const message = String(text || "");
            const isInteropMessage = /WEB018.*(?:Interop|interopérabilité)/i.test(message);
            const isInteropSuccess = type === "success" && /interopérabilité.*active/i.test(message);
          
            if (isInteropSuccess) {
              if (interopBadge) {
                interopBadge.textContent = "Intéropérabilité OK";
                interopBadge.className = "pill ok";
              }
              ui.messageBox.textContent = "";
              ui.messageBox.className = "message success hidden";
              return;
            }
          
            if (isInteropMessage && type !== "error") {
              if (interopBadge && !currentUser) interopBadge.classList.add("hidden");
              ui.messageBox.textContent = "";
              ui.messageBox.className = \`message \${type} hidden\`;
              return;
            }
          
            ui.messageBox.textContent = text;
            ui.messageBox.className = \`message \${type}\`;
          }
          
          `;
          app = app.slice(0, setMessageStart) + newSetMessage + app.slice(setMetricStart);
          
          const logoutNeedle = 'ui.authState.className = "pill neutral auth-pill";';
          if (app.includes(logoutNeedle) && !app.includes('interopCompactStatus")?.classList.add("hidden")')) {
            app = app.replace(logoutNeedle, logoutNeedle + '\n    document.getElementById("interopCompactStatus")?.classList.add("hidden");');
          }
          
          // 5) Version / cache bust.
          if (!html.includes('WEB046 · WEBACTIVITY002')) {
            if (html.includes('WEB045 · WEBACTIVITY001')) {
              html = html.replace('WEB045 · WEBACTIVITY001', 'WEB046 · WEBACTIVITY002 · WEB045 · WEBACTIVITY001');
            } else {
              html = html.replace('</head>', '  <!-- WEB046 · WEBACTIVITY002 -->\n</head>');
            }
          }
          html = html.replace(/src=["']\.\/app\.js(?:\?v=[^"']*)?["']/, 'src="./app.js?v=WEB046-WEBACTIVITY002"');
          
          // 6) CSS : dépouillement, répertoire lisible, pile détail ancrée sur deux lignes.
          const css = `
          <style id="web046-activity-ui">
            /* WEB046 · WEBACTIVITY002 */
            body.ux-activities-page #catalogView > .hero { display: none !important; }
            .hero-actions .interop-badge, #personalSyncStatus { display: none !important; }
          
            #activityDirectorySection { padding-top: 12px; }
            #activityDirectorySection > .panel-title-row { display: none !important; }
            .activity-directory-footer .muted { display: none !important; }
            .directory-load-actions-bottom {
              display: flex;
              justify-content: flex-end;
              gap: 10px;
              margin-top: 12px;
              padding-top: 12px;
              border-top: 1px solid rgba(128,128,128,.18);
            }
          
            .activity-card {
              grid-template-columns: 68px minmax(170px,.95fr) repeat(5,minmax(88px,.62fr)) !important;
              align-items: stretch !important;
              gap: 11px !important;
              min-height: 88px;
            }
            .activity-main-web046 {
              display: flex !important;
              align-items: center !important;
              justify-content: center !important;
              min-width: 0 !important;
            }
            .activity-sport-icon-web046 {
              display: flex !important;
              align-items: center !important;
              justify-content: center !important;
              width: 58px !important;
              height: 58px !important;
              color: var(--green);
            }
            .activity-sport-icon-web046 svg {
              width: 50px;
              height: 50px;
              fill: none;
              stroke: currentColor;
              stroke-width: 3.2;
              stroke-linecap: round;
              stroke-linejoin: round;
            }
            .activity-icon-fallback { font-size: 34px; line-height: 1; }
            .activity-card .datum {
              display: flex;
              flex-direction: column;
              justify-content: center;
            }
            .activity-card .datum strong { font-size: 15px; }
            .activity-card .datum span { margin-top: 5px; }
            .activity-start-datum strong { font-size: 14px !important; }
          
            .detail-sticky-stack {
              position: sticky;
              top: 82px;
              z-index: 3200;
              display: grid;
              gap: 6px;
              padding: 7px 0 8px;
              background: linear-gradient(to bottom, rgba(9,11,10,.98) 88%, rgba(9,11,10,.88));
              backdrop-filter: blur(14px);
              -webkit-backdrop-filter: blur(14px);
            }
            #detailView .detail-sticky-stack .detail-toolbar {
              position: static !important;
              top: auto !important;
              z-index: auto !important;
              margin: 0 !important;
              box-shadow: none !important;
            }
            #detailView .detail-sticky-stack .detail-hero-two-lines {
              margin-top: 0 !important;
              padding: 10px 14px !important;
              gap: 8px !important;
            }
            #detailView .detail-summary-row {
              grid-template-columns: auto auto repeat(5,minmax(92px,1fr)) !important;
              gap: 7px !important;
            }
            #detailView .detail-controls-row {
              grid-template-columns: minmax(260px,.8fr) minmax(520px,1.7fr) !important;
              gap: 12px !important;
              align-items: end !important;
              padding-top: 8px !important;
            }
            #detailView .detail-data-quality { display: none !important; }
            #detailView .detail-quick-equipment,
            #detailView .detail-quick-landmarks { min-width: 0; }
          
            @media (max-width: 1050px) {
              .activity-card {
                grid-template-columns: 60px minmax(150px,1fr) repeat(3,minmax(82px,.7fr)) !important;
              }
              .activity-card .hide-md { display: none !important; }
              .detail-sticky-stack { top: 76px; }
              #detailView .detail-summary-row { grid-template-columns: repeat(4,minmax(105px,1fr)) !important; }
              #detailView .detail-controls-row { grid-template-columns: 1fr !important; }
            }
            @media (max-width: 760px) {
              .activity-card { grid-template-columns: 54px minmax(150px,1fr) 90px !important; }
              .activity-sport-icon-web046 { width: 48px !important; height: 48px !important; }
              .activity-sport-icon-web046 svg { width: 42px; height: 42px; }
              .activity-card .hide-sm { display: none !important; }
              .detail-sticky-stack { top: 70px; }
              #detailView .detail-summary-row { grid-template-columns: repeat(2,minmax(120px,1fr)) !important; }
            }
          </style>`;
          
          if (!html.includes('id="web046-activity-ui"')) {
            const headEnd = html.indexOf('</head>');
            if (headEnd < 0) fail('</head> introuvable', 27);
            html = html.slice(0, headEnd) + css + '\n' + html.slice(headEnd);
          }
          
          fs.writeFileSync(appFile, app, 'utf8');
          fs.writeFileSync(indexFile, html, 'utf8');
          console.log('OK : WEB046 · WEBACTIVITY002 appliqué.');
          NODE

      - name: Créer la note de version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/releases
          cat > docs/releases/WEB046.md <<'EOF'
          # WEB046 · WEBACTIVITY002

          Deuxième passe de simplification de l'onglet Activités :
          - suppression du grand titre Activités dans l'onglet déjà sélectionné ;
          - un seul statut d'interopérabilité, compact, dans le topbar juste avant Firebase ;
          - suppression de l'en-tête WEB031 / Répertoire / compteur ;
          - commandes de chargement déplacées en bas du répertoire ;
          - icônes course/vélo SVG agrandies et centrées verticalement ;
          - date + heure présentées comme une donnée « Départ », au même format visuel que Distance/D+/Durée ;
          - barre de navigation ET résumé activité ancrés ensemble ;
          - résumé détail conservé sur deux lignes : statistiques puis matériel + repères.

          Aucune modification Firestore, Strava ou WEBSPLIT.
          EOF

      - name: Vérifier WEB046
        shell: bash
        run: |
          set -euo pipefail
          node --check web/app.js
          grep -Fq 'WEB046 · WEBACTIVITY002' web/index.html
          grep -Fq 'id="interopCompactStatus"' web/index.html
          grep -Fq 'Intéropérabilité OK' web/index.html
          grep -Fq 'document.body.classList.toggle("ux-activities-page"' web/app.js
          grep -Fq 'function upgradeActivityUiWeb046()' web/app.js
          grep -Fq 'directory-load-actions-bottom' web/app.js
          grep -Fq 'activitySportIconMarkup' web/app.js
          grep -Fq 'datum("Départ", formatActivityStart(activity.start_time_ms)' web/app.js
          grep -Fq 'detail-sticky-stack' web/app.js
          grep -Fq 'app.js?v=WEB046-WEBACTIVITY002' web/index.html
          git diff --check
          echo 'WEB046 vérifié.'

      - name: Commit et push WEB046
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app.js web/index.html docs/releases/WEB046.md
          if git diff --cached --quiet; then
            echo 'WEB046 déjà appliqué : aucun nouveau commit.'
          else
            git commit -m "WEB046 WEBACTIVITY002 epure et ancre interface activites"
            git push origin HEAD:main
          fi

      - name: Déclencher la publication GitHub Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run web.yml --ref main
          echo 'Publication demandée : Publier SPORT Web · WEB043'
