          # WEB055-FIX4 · GOAL005 / REGULARITY004 / COMPARE004 / GAP004

          ## Objectifs
          - Une seule jauge superposée pour Distance et D+.
          - Vert = réalisé jusqu'à la cible théorique.
          - Si retard : seul le bout manquant reste rouge au-delà du vert.
          - Si avance : seul le dépassement au-delà de la cible théorique est or.
          - Trois indicateurs seulement : reste, rythme hebdomadaire théorique, rythme quotidien théorique.

          ## Régularité
          - Deux seuils : Distance et D+.
          - Sélecteur OU / ET.
          - Toutes les années sont inscrites.
          - Survol d'une barre : année + nombre de jours.

