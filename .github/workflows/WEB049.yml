              }
            }
          </style>`;

          const oldCss = /<style id=["']web049-ui-contract["']>[\s\S]*?<\/style>/m;
          if (oldCss.test(html)) {
            html = html.replace(oldCss, css);
          } else {
            const headEnd = html.indexOf("</head>");
            if (headEnd < 0) fail("</head> introuvable");
            html = html.slice(0, headEnd) + css + "\n" + html.slice(headEnd);
          }

          if (!html.includes("WEB049 · WEBUI001")) {
            html = html.replace(
              "</head>",
              '  <!-- WEB049 · WEBUI001 · contrat interface consolidé -->\n</head>'
            );
          }

          html = html.replace(
            /src=["']\.\/app\.js(?:\?v=[^"']*)?["']/,
            'src="./app.js?v=WEB049-WEBUI001"'
          );

          fs.writeFileSync(appFile, app, "utf8");
          fs.writeFileSync(indexFile, html, "utf8");

          console.log("OK : WEB049 · WEBUI001 appliqué.");
          NODE

      - name: Installer contrat WEB049
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p scripts/web049 docs/releases

          cat > scripts/web049/validate_web049.mjs <<'NODE'
          import fs from "node:fs";

          const app = fs.readFileSync("web/app.js","utf8");
          const html = fs.readFileSync("web/index.html","utf8");

          function requireToken(source, token, label) {
            if (!source.includes(token)) {
              console.error("ECHEC WEB049 :", label, "absent");
              process.exit(20);
            }
          }

          function forbidToken(source, token, label) {
            if (source.includes(token)) {
              console.error("ECHEC WEB049 :", label, "encore présent");
              process.exit(21);
            }
          }

          requireToken(app, '["equipment-map","Matériel auto"]', "Plus > Matériel auto");
          requireToken(app, '["maps","Cartes"]', "Plus > Cartes");
          forbidToken(app, '["data","Données"]', "Plus > Données");

          requireToken(app, "function activitySportIconMarkupWeb049", "SVG sport");
          requireToken(app, 'datum("Date", formatActivityDateWeb049(activity.start_time_ms)', "Date");
          requireToken(app, 'datum("Départ", formatActivityTimeWeb049(activity.start_time_ms)', "Départ");
          requireToken(app, "function applyWeb049UiContract()", "garde-fou UI");
          requireToken(app, "detail-start-stat-web049", "Date/Départ détail");
          requireToken(app, "detail-sport-svg-web049", "SVG détail");

          requireToken(html, 'id="web049-ui-contract"', "CSS WEB049");
          requireToken(html, 'id="web049InteropStatus"', "Interop unique");
          requireToken(html, 'app.js?v=WEB049-WEBUI001', "cache-bust");
          forbidToken(html, 'data-ux-page="maps">Cartes</button>', "Cartes navigation principale");

          if (/function activityMain\(activity\)[\s\S]{0,700}custom_title/.test(app)) {
            console.error("ECHEC WEB049 : titre activité encore utilisé dans activityMain");
            process.exit(22);
          }

          console.log("WEB049 : contrat interface validé.");
          NODE

          cat > docs/releases/WEB049.md <<'EOF'
          # WEB049 · WEBUI001 — consolidation de l'interface

          Contrat visuel et navigation consolidés.

          - Activités : aucun titre d'activité dans le répertoire ni le détail.
          - Activités : grand pictogramme SVG selon le sport.
          - Activités : Date et Départ sont deux données distinctes.
          - Activités : filtres sous un bandeau déroulant fermé par défaut.
          - Activités : suppression des mentions techniques et compteurs redondants.
          - Détail : ligne 1 = sport + date/départ + statistiques.
          - Détail : ligne 2 = matériel + repères.
          - Détail : barre de navigation sticky, résumé sticky juste dessous.
          - Plus : Matériel auto restauré via WEBEQUIPMAP001.
          - Plus : Cartes déplacé sous Plus.
          - Plus : Données supprimé.
          - Navigation principale : Cartes supprimé.
          - Interopérabilité : un seul badge compact dans le topbar.

          Aucun changement du moteur Firestore, Strava ou WEBSPLIT.
          EOF

      - name: Ajouter WEB049 au workflow de publication
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          const file = ".github/workflows/web.yml";
          let s = fs.readFileSync(file, "utf8");

          if (!s.includes("Valider contrat interface WEB049")) {
            const marker = "      - name: Valider WEB043";
            const pos = s.indexOf(marker);

            if (pos < 0) {
              console.error("ERREUR : étape Valider WEB043 introuvable dans web.yml");
              process.exit(30);
            }

            const step =
              "      - name: Valider contrat interface WEB049\n" +
              "        run: |\n" +
              "          node --check web/app.js\n" +
              "          node scripts/web049/validate_web049.mjs\n\n";

            s = s.slice(0, pos) + step + s.slice(pos);
            fs.writeFileSync(file, s, "utf8");
          }

          console.log("OK : contrat WEB049 branché sur les publications futures.");
          NODE

      - name: Validation complète
        shell: bash
        run: |
          set -euo pipefail

          node --check web/app.js
          node scripts/web049/validate_web049.mjs
          git diff --check

          grep -Fq 'Valider contrat interface WEB049' .github/workflows/web.yml
          grep -Fq 'function renderEquipmentMappingPanel' web/app.js
          grep -Fq 'id="equipmentMappingSection"' web/index.html

          echo
          echo "=============================================="
          echo "WEB049 · CONTRATS VALIDES"
          echo "=============================================="
          echo "TITRES ACTIVITES ABSENTS   : OK"
          echo "GRAND SVG SPORT            : OK"
          echo "DATE + DEPART              : OK"
          echo "FILTRES REPLIABLES         : OK"
          echo "MENTIONS TECHNIQUES        : OK"
          echo "INTEROP UNIQUE             : OK"
          echo "CARTES HORS NAV PRINCIPALE : OK"
          echo "PLUS > CARTES              : OK"
          echo "PLUS > MATERIEL AUTO       : OK"
          echo "PLUS > DONNEES ABSENT      : OK"
          echo "DETAIL 2 LIGNES            : OK"
          echo "STICKY SOUS TOOLBAR        : OK"
          echo "WEBEQUIPMAP001 CONSERVE    : OK"
          echo "NODE CHECK                 : OK"

      - name: Commit et push WEB049
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            web/app.js \
            web/index.html \
            scripts/web049/validate_web049.mjs \
            docs/releases/WEB049.md \
            .github/workflows/web.yml

          if git diff --cached --quiet; then
            echo "WEB049 déjà appliqué : aucun nouveau commit."
          else
            git commit -m "WEB049 WEBUI001 consolide interface et verrouille contrats UI"
            git push origin HEAD:main
          fi

      - name: Déclencher publication Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run web.yml --ref main
          echo "Publication demandée : Publier SPORT Web · WEB043"
