              }

              #activityList .activity-card .hide-sm {
                display: none !important;
              }

              #detailView > .detail-hero-two-lines,
              #detailView .detail-hero-web049 {
                position: relative !important;
                top: auto !important;
              }

              #detailView .detail-hero-two-lines > .detail-summary-row {
                grid-template-columns: 76px minmax(190px,1fr) !important;
              }

