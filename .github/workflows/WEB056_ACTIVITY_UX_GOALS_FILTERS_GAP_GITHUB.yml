      - name: Valider WEB056
        shell: bash
        run: |
          set -euo pipefail

          req() {
            local file="$1"
            local token="$2"
            local label="$3"
            if grep -Fq "$token" "$file"; then
              echo "✓ $label"
            else
              echo "❌ $label"
              echo "Token absent : $token"
              exit 40
            fi
          }

          echo "=== Syntaxe ==="
          node --check web/app.js
          npx --yes acorn@8.15.0 --ecma2022 --module web/app.js >/dev/null
          git diff --check
          echo "✓ Syntaxe"

          echo
          echo "=== Navigation ==="
          req web/index.html '← Activité suivante' 'boutons Activité suivante'
          req web/index.html 'Activité précédente →' 'boutons Activité précédente'

          echo
          echo "=== Répertoire / filtres ==="
          req web/app.js 'const WEB056_FILTER_DEFS' 'filtres progressifs'
          req web/app.js 'function installProgressiveActivityFiltersWeb056()' 'installation filtres'
          req web/index.html 'web056-original-filters' 'anciens filtres masqués'
          req web/index.html 'min-height: calc(96px - 1cm)' 'hauteur répertoire réduite'

          echo
          echo "=== Objectifs ==="
          req web/app.js 'const dailyRequired = remaining / remainingDays;' 'rythme quotidien restant'
          req web/app.js 'const weeklyRequired = dailyRequired * 7;' 'rythme hebdo restant'
          req web/app.js 'Rythme hebdo à suivre' 'libellé rythme hebdo'
          req web/app.js 'Rythme quotidien à suivre' 'libellé rythme quotidien'
          if grep -Fq 'Reste avant objectif' web/app.js; then
            echo "❌ case Reste avant objectif encore présente"
            exit 41
          fi
          echo "✓ case Reste avant objectif supprimée"

          echo
          echo "=== Détail activité ==="
          req web/app.js 'function formatCyclingSpeedWeb056(activity)' 'vitesse vélo dédiée'
          req web/app.js 'minimumFractionDigits: 2' '2 décimales vélo'
          req web/app.js 'sport === 1 ? "Allure"' 'Allure course'
          req web/app.js 'sport === 2 ? "Vitesse"' 'Vitesse vélo'
          req web/index.html '#detailView .hero-metric.summary-chip' 'centrage encarts'

          echo
          echo "=== Repères ==="
          req web/app.js 'function landmarkAllowedForActivityWeb056(activity, code)' 'règle repère Q'
          req web/app.js 'rebuildAddLandmarkSelect(links, activity);' 'select repères contextualisé'

          echo
          echo "=== GAP ==="
          req web/app.js 'function web055RouteAverageGap(route)' 'moteur GAP'
          req web/app.js '155.4 * Math.pow(g, 5)' 'fallback GAP pente'
          req web/app.js 'const actualPace = 1000 / speed;' 'fallback GAP vitesse'

          echo
          echo "=== Acquis ==="
          req web/app.js 'const EQUIPMENT_PROFILES_WEB058' 'FIX8 profils matériel'
          req web/app.js 'const subSport = document.getElementById("activitySubSportFilterWeb054")?.value || "";' 'FIX7 sous-sport'
          req web/app.js 'WEB055-FIX6 · ACTIVITYOPEN001' 'FIX6 ouverture activité'
          req web/app.js 'await signInWithPopup(auth, provider);' 'Auth popup'
          req web/app.js 'function renderUnifiedConnectionBadgeWeb055()' 'badge connexion'
          req web/app.js 'queueMicrotask(() => installEquipmentMappingEditorWeb050());' 'TDZFIX001'

          MUT="$(grep -c 'new MutationObserver' web/app.js || true)"
          [ "$MUT" = "0" ] || {
            echo "❌ MutationObserver : $MUT"
            exit 42
          }
          echo "✓ MutationObserver = 0"

          if [ -f scripts/contracts/validate_web_golden.mjs ]; then
            echo
            echo "=== Contrat golden ==="
            GOLDEN="$(mktemp)"
            if node scripts/contracts/validate_web_golden.mjs >"$GOLDEN" 2>&1; then
              tail -n 30 "$GOLDEN" || true
              echo "✓ Contrat golden"
            else
              echo "❌ Contrat golden"
              tail -n 120 "$GOLDEN" || cat "$GOLDEN"
              rm -f "$GOLDEN"
              exit 43
            fi
            rm -f "$GOLDEN"
          fi

          echo
          echo "======================================================"
          echo "✅ WEB056 VALIDÉ"
          echo "NAVIGATION       : LIBELLES INVERSES"
          echo "REPERTOIRE       : -1 CM + FILTRES PROGRESSIFS"
          echo "OBJECTIFS        : RYTHME RESTANT A SUIVRE"
          echo "DETAIL           : CENTRE + ALLURE/VITESSE"
          echo "REPERE Q VELO    : NON PROPOSE"
          echo "GAP              : PUBLIE OU ESTIME VITESSE+PENTE"
          echo "======================================================"

