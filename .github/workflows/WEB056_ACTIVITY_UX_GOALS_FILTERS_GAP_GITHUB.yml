            }

            #detailView .hero-metric.summary-chip > span,
            #detailView .hero-metric.summary-chip > strong,
            #detailView .detail-start-stat-web049 > span,
            #detailView .detail-start-stat-web049 > strong,
            #detailView .detail-start-stat > span,
            #detailView .detail-start-stat > strong {
              width: 100% !important;
              text-align: center !important;
              margin-left: 0 !important;
              margin-right: 0 !important;
            }

            /* Objectifs : deux indicateurs seulement. */
            .web055-fix5-goal-details {
