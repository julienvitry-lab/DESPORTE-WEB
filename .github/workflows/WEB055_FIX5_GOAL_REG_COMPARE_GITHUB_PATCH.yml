            function storedThreshold(metric) {
              const raw = localStorage.getItem(metric === 'ascent' ? ascentKey : distanceKey);
              const fallback = metric === 'ascent' ? 500 : 10;
              const value = Number(String(raw == null ? fallback : raw).replace(',', '.'));
