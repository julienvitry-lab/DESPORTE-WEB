      - name: Valider WEB055-FIX5
        run: |
          set -euo pipefail
          node --check web/app.js
          npx --yes acorn@8.15.0 --ecma2022 --module web/app.js >/dev/null
          git diff --check

          grep -Fq 'WEB055-FIX5 · GOAL006' web/app.js
          grep -Fq 'WEB055-FIX5 · REGULARITY005' web/app.js
          grep -Fq 'WEB055-FIX5 · COMPARE005' web/app.js
          grep -Fq 'function web055RegularityMetricValue(' web/app.js
          grep -Fq 'web055RegularityMetric' web/app.js
          grep -Fq 'web055RegularityCombineToggle' web/app.js
          grep -Fq 'function web055MoveComparisonCursor(' web/app.js
          grep -Fq '<h3>Comparaison</h3>' web/app.js
          grep -Fq 'WEB055-FIX5-GOAL006-REG005-COMP005' web/index.html

          # Vérification explicite du bug 31 jours : une année normale doit donner 365, une bissextile 366.
          node <<'NODE'
          function days(year) {
            const start = new Date(Number(year), 0, 1);
            const end = new Date(Number(year) + 1, 0, 1);
            return Math.round((end.getTime() - start.getTime()) / 86400000);
          }
          if (days(2026) !== 365) process.exit(51);
          if (days(2028) !== 366) process.exit(52);
          const pct = 247 / 365 * 100;
          if (pct < 67 || pct > 68.5) process.exit(53);
          NODE

          # Acquis à préserver.
          grep -Fq 'WEB055-FIX4 · GAP004' web/app.js
          grep -Fq 'WEB055_FIX3_GAP_CACHE · GAP003' web/app.js
          grep -Fq 'WEB055-FIX3 · PERF003' web/app.js
          grep -Fq 'await signInWithPopup(auth, provider);' web/app.js
          grep -Fq 'function renderUnifiedConnectionBadgeWeb055()' web/app.js
          grep -Fq 'queueMicrotask(() => installEquipmentMappingEditorWeb050());' web/app.js
          grep -Fq 'const EQUIPMENT_PROFILES_WEB053' web/app.js
          test "$(grep -c 'new MutationObserver' web/app.js || true)" = "0"

          if [ -f scripts/contracts/validate_web_golden.mjs ]; then
            node scripts/contracts/validate_web_golden.mjs
          fi

      - name: Préparer le déploiement Cloud Shell
        run: |
          set -euo pipefail
          mkdir -p scripts docs/releases

          cat > scripts/deploy_web055_fix5_cloudshell.sh <<'EOF2'
          #!/usr/bin/env bash
          set -euo pipefail

          git fetch origin
          git checkout main
          git reset --hard origin/main

          node --check web/app.js
          grep -Fq 'WEB055-FIX5-GOAL006-REG005-COMP005' web/index.html
          grep -Fq 'WEB055-FIX5 · GOAL006' web/app.js
          grep -Fq 'WEB055-FIX5 · REGULARITY005' web/app.js
          grep -Fq 'WEB055-FIX5 · COMPARE005' web/app.js

          cat > firebase.hosting.web055fix5.json <<'JSON'
          {
            "hosting": {
              "site": "sport-505813",
              "public": "web",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "headers": [
                {
                  "source": "**",
                  "headers": [
                    {
                      "key": "Cache-Control",
                      "value": "no-cache, no-store, must-revalidate"
                    }
                  ]
                }
              ]
            }
          }
          JSON

          npx --yes firebase-tools@15.28.2 deploy \
            --only hosting \
            --project sport-505813 \
            --config firebase.hosting.web055fix5.json

          echo
          echo "✅ WEB055-FIX5 DEPLOYE"
          echo "https://sport-505813.web.app"
          EOF2

          chmod +x scripts/deploy_web055_fix5_cloudshell.sh

          cat > docs/releases/WEB055-FIX5.md <<'EOF2'
          # WEB055-FIX5 · GOAL006 / REGULARITY005 / COMPARE005

          ## Objectifs
          - Corrige le calcul du nombre de jours de l'année : 365/366 au lieu de 31.
          - La cible théorique est exactement la fraction de l'année écoulée.
          - Rouge = cible théorique cumulée ; vert = réalisé ; or = avance.
          - Trois indicateurs conservés : reste, rythme hebdo théorique, rythme quotidien théorique.

          ## Régularité
          - Mode simple par défaut : Distance ou D+ via menu déroulant.
          - Bouton « + 2e critère » pour activer explicitement une combinaison ET/OU.
          - Le deuxième critère est automatiquement l'autre métrique.
          - Histogramme annuel et survol conservés.

          ## Comparaison
          - Titre raccourci à « Comparaison ».
          - Année antérieure toujours sélectionnable.
          - Déplacement du pointeur sur le graphique : date, valeurs et écart évoluent en direct.
          EOF2

      - name: Commit et push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add web/app.js web/index.html \
            scripts/deploy_web055_fix5_cloudshell.sh \
            docs/releases/WEB055-FIX5.md

          if git diff --cached --quiet; then
            echo "WEB055-FIX5 deja applique : aucun commit necessaire."
            exit 0
          fi

          git commit -m "WEB055 FIX5 corrige objectifs regularite et comparaison interactive"
          git push origin HEAD:main

          echo
          echo "✅ WEB055-FIX5 pousse sur main"
          echo "Commit : $(git rev-parse --short HEAD)"
