name: Publier SPORT Web · WEB005

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      - "docs/releases/WEB005.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "sport-web-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Valider WEB005
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js
          grep -Fq "WEB005 · CARTO+ · Comfortaa" web/index.html
          grep -Fq 'family=Comfortaa' web/index.html
          grep -Fq 'font-family: "Comfortaa"' web/styles.css
          grep -Fq 'z-index: 4000' web/styles.css
          grep -Fq 'isolation: isolate' web/styles.css
          grep -Fq 'OpenTopoMap' web/index.html
          grep -Fq 'function toggleMapFullscreen()' web/app.js
          grep -Fq 'function switchBaseLayer(key)' web/app.js
          grep -Fq 'function renderRouteStats(route, sourceCount)' web/app.js
          grep -Fq 'D+ cumulé' web/app.js
          grep -Fq 'activityMapInstance.on("mousemove"' web/app.js
          grep -Fq '"activity_routes"' web/app.js
          if grep -Eq '\b(setDoc|addDoc|updateDoc|deleteDoc|writeBatch|runTransaction)\b' web/app.js; then
            echo "::error::WEB005 doit rester strictement en lecture seule."
            exit 1
          fi
          echo "WEB005 : Comfortaa + z-index + CARTO+ interactif, lecture seule validés."

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./web"

      - name: Publier SPORT Web · WEB005
        id: deployment
        uses: actions/deploy-pages@v4
