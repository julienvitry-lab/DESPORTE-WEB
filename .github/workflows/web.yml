name: Publier SPORT Web · WEB018

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      - "docs/releases/WEB018.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "sport-web-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Valider WEB018
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js

          grep -Fq "WEB018 · SYNCHEALTH001" web/index.html
          grep -Fq "Santé de la synchronisation" web/index.html
          grep -Fq "syncHealthRetryButton" web/index.html

          grep -Fq 'WEB_PENDING_MUTATIONS_KEY' web/app.js
          grep -Fq 'function startSyncHealthWatch' web/app.js
          grep -Fq 'function publishWebHealth' web/app.js
          grep -Fq 'function flushPendingWebMutations' web/app.js
          grep -Fq 'function commitWebMutationOnline' web/app.js
          grep -Fq '"sync_health"' web/app.js
          grep -Fq 'webVersion: "WEB018"' web/app.js

          # WEB018 · WEBCARTO003.
          grep -Fq "WEB018 · WEBCARTO003" web/index.html
          grep -Fq 'mapRouteModeSelect' web/index.html
          grep -Fq 'mapKmMarkersToggle' web/index.html
          grep -Fq 'mapRecenterButton' web/index.html
          grep -Fq 'function calculateRouteGrades' web/app.js
          grep -Fq 'function redrawRouteOverlay' web/app.js
          grep -Fq 'function renderKmMarkers' web/app.js
          grep -Fq 'function recenterActivityMap' web/app.js
          grep -Fq 'routeAnalysis' web/index.html
          grep -Fq 'routeSegmentList' web/index.html
          grep -Fq 'function detectRouteSegments' web/app.js
          grep -Fq 'function renderRouteAnalysis' web/app.js
          grep -Fq 'function selectRouteSegment' web/app.js
          grep -Fq 'function clearRouteSegmentSelection' web/app.js
          grep -Fq '.route-segment-card' web/styles.css
          grep -Fq '.profile-segment-highlight' web/styles.css
          grep -Fq '.route-km-icon' web/styles.css
          grep -Fq '.map-slope-legend' web/styles.css

          # Héritages critiques.
          grep -Fq 'function trashActivityFromWeb' web/app.js
          grep -Fq 'function startSyncHistoryWatch' web/app.js
          grep -Fq 'function detectSyncConflicts' web/app.js
          grep -Fq 'function loadWebDashboard' web/app.js
          grep -Fq 'function renderDashboardChart' web/app.js
          grep -Fq 'function loadPersonalSyncData' web/app.js

          grep -Fq 'family=Comfortaa' web/index.html
          grep -Fq 'z-index: 4000' web/styles.css

          echo "WEB018 : WEBCARTO003 + WEBCARTO002 + SYNCHEALTH001 + DASHBOARD002 + CORBEILLE001 + SYNCGUARD001 validés."

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./web"

      - name: Publier SPORT Web · WEB018
        id: deployment
        uses: actions/deploy-pages@v4
