name: Publier SPORT Web · WEB043

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "functions/**"
      - "firebase.functions.json"
      - "scripts/deploy_strava_backend.sh"
      - ".github/workflows/web.yml"
      - "docs/releases/WEB043.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "sport-web-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Valider SPORT Web courant
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================================"
          echo "CGWEB120 FIX5 · VALIDATION COURANTE"
          echo "======================================================"

          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js

          echo "✓ fichiers Web présents"

          npx --yes acorn \
            --ecma2022 \
            --module \
            web/app.js \
            >/dev/null

          echo "✓ syntaxe web/app.js"

          grep -Fq \
            'CGWEB120_FIX5_START' \
            web/app.js

          grep -Fq \
            'CGWEB120_FIX5_STYLE_START' \
            web/index.html

          grep -Fq \
            'data-cgweb120-fix5-hidden="1"' \
            web/index.html

          grep -Eq \
            'src="\./app\.js\?v=[^"]+"' \
            web/index.html

          grep -Fq \
            'function renderActivities()' \
            web/app.js

          grep -Fq \
            'function renderDetail(activity)' \
            web/app.js

          grep -Fq \
            'function renderCartography(activity)' \
            web/app.js

          echo "✓ socle SPORT Web présent"
          echo "✓ CGWEB120 FIX5 présent"
          echo "======================================================"
          echo "VALIDATION OK"
          echo "======================================================"

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./web"

      - name: Publier SPORT Web · WEB043
        id: deployment
        uses: actions/deploy-pages@v4
