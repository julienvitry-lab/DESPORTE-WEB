name: Publier SPORT Web · WEB013
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml", "docs/releases/WEB013.md"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "sport-web-pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
      - name: Valider WEB013
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "WEB013 · PERSONAL001" web/index.html
          grep -Fq 'table: "sport_goals"' web/app.js
          grep -Fq 'table:"journal_entries"' web/app.js
          grep -Fq 'function loadPersonalSyncData' web/app.js
          grep -Fq 'function persistGoalRow' web/app.js
          grep -Fq 'function persistWeight' web/app.js
          grep -Fq 'function loadWebDashboard' web/app.js
          grep -Fq 'writeBatch' web/app.js
          grep -Fq 'onSnapshot' web/app.js
          grep -Fq 'family=Comfortaa' web/index.html
          echo "WEB013 : objectifs + poids interopérables + dashboard validés."
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./web"
      - name: Publier SPORT Web · WEB013
        id: deployment
        uses: actions/deploy-pages@v4
