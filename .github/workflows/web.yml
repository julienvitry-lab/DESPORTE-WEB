name: Publier SPORT Web · WEB015

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      - "docs/releases/WEB015.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "sport-web-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Valider WEB015
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js

          grep -Fq "WEB015 · DASHBOARD002" web/index.html
          grep -Fq "Tableau de bord avancé" web/index.html
          grep -Fq "Tendances" web/index.html
          grep -Fq "Objectif annuel" web/index.html
          grep -Fq "Répartition sportive" web/index.html
          grep -Fq "dashboardChartDistanceButton" web/index.html
          grep -Fq "dashboardDrilldownNotice" web/index.html

          grep -Fq 'function dashboardPreviousWindow' web/app.js
          grep -Fq 'function renderDashboardChart' web/app.js
          grep -Fq 'function openDashboardBucket' web/app.js
          grep -Fq 'function renderDashboardTrends' web/app.js
          grep -Fq 'function renderDashboardGoal' web/app.js
          grep -Fq 'function renderDashboardSportSplit' web/app.js
          grep -Fq 'function renderDashboardRecords' web/app.js
          grep -Fq 'getAggregateFromServer' web/app.js
          grep -Fq 'webVersion: "WEB015"' web/app.js

          # Héritages prioritaires : interop, corbeille et garde de synchro.
          grep -Fq 'function trashActivityFromWeb' web/app.js
          grep -Fq 'function restoreActivityFromWeb' web/app.js
          grep -Fq 'function startSyncHistoryWatch' web/app.js
          grep -Fq 'function detectSyncConflicts' web/app.js
          grep -Fq 'function loadPersonalSyncData' web/app.js
          grep -Fq 'writeBatch' web/app.js
          grep -Fq 'onSnapshot' web/app.js

          # Identité et correctif cartographique conservés.
          grep -Fq 'family=Comfortaa' web/index.html
          grep -Fq 'z-index: 4000' web/styles.css
          grep -Fq 'isolation: isolate' web/styles.css

          echo "WEB015 : DASHBOARD002 + interop + corbeille + syncguard validés."

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./web"

      - name: Publier SPORT Web · WEB015
        id: deployment
        uses: actions/deploy-pages@v4
