name: Publier SPORT Web · WEB007

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      - "docs/releases/WEB007.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "sport-web-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Valider WEB007
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js

          grep -Fq "WEB007 · INTEROP · Comfortaa" web/index.html
          grep -Fq 'family=Comfortaa' web/index.html
          grep -Fq 'z-index: 4000' web/styles.css
          grep -Fq 'isolation: isolate' web/styles.css

          # Interop bidirectionnelle héritée de WEB006.
          grep -Fq 'writeBatch' web/app.js
          grep -Fq 'onSnapshot' web/app.js
          grep -Fq '"changes"' web/app.js
          grep -Fq 'function commitWebMutation' web/app.js
          grep -Fq 'function startInteropWatch' web/app.js
          grep -Fq 'webVersion: "WEB007"' web/app.js

          # WEB007 : plus de validation manuelle, autosave sérialisé.
          grep -Fq 'const AUTOSAVE_DELAY_MS = 800' web/app.js
          grep -Fq 'function scheduleCurrentActivityAutosave' web/app.js
          grep -Fq 'function flushCurrentActivityAutosave' web/app.js
          grep -Fq 'function queueActivityAutosave' web/app.js
          grep -Fq 'function persistActivityEdits' web/app.js
          grep -Fq 'ui.addLandmarkSelect.addEventListener("change"' web/app.js
          grep -Fq 'Synchronisation automatique' web/index.html

          if grep -Fq 'Enregistrer sur les 3 appareils' web/index.html; then
            echo "::error::WEB007 ne doit plus demander de bouton Enregistrer."
            exit 1
          fi

          # Les écritures restent centralisées dans commitWebMutation/writeBatch.
          if grep -Eq '\b(setDoc|addDoc|updateDoc|deleteDoc|runTransaction)\b' web/app.js; then
            echo "::error::WEB007 doit centraliser les écritures dans commitWebMutation/writeBatch."
            exit 1
          fi

          echo "WEB007 : autosynchronisation Web ↔ Android + CARTO+ + Comfortaa validés."

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./web"

      - name: Publier SPORT Web · WEB007
        id: deployment
        uses: actions/deploy-pages@v4
