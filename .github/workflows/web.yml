name: Publier SPORT Web · WEB008

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      - "docs/releases/WEB008.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "sport-web-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Valider WEB008
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js

          grep -Fq "WEB008 · EDITION002 · Comfortaa" web/index.html
          grep -Fq 'editEquipmentSelect' web/index.html
          grep -Fq 'editFeelingSelect' web/index.html
          grep -Fq 'editDifficultySelect' web/index.html
          grep -Fq 'editPrivacySelect' web/index.html
          grep -Fq 'editDescriptionInput' web/index.html

          grep -Fq 'writeBatch' web/app.js
          grep -Fq 'onSnapshot' web/app.js
          grep -Fq 'function saveImmediateActivityFields' web/app.js
          grep -Fq 'function rebuildEquipmentEditor' web/app.js
          grep -Fq 'feeling_score' web/app.js
          grep -Fq 'difficulty_score' web/app.js
          grep -Fq 'equipment_manual: 1' web/app.js
          grep -Fq 'privacy: normalizePrivacy' web/app.js
          grep -Fq 'webVersion: "WEB008"' web/app.js

          grep -Fq 'family=Comfortaa' web/index.html
          grep -Fq 'z-index: 4000' web/styles.css
          grep -Fq 'isolation: isolate' web/styles.css

          if grep -Fq 'Enregistrer sur les 3 appareils' web/index.html; then
            echo "::error::WEB008 ne doit pas réintroduire de validation manuelle."
            exit 1
          fi

          if grep -Eq '\b(setDoc|addDoc|updateDoc|deleteDoc|runTransaction)\b' web/app.js; then
            echo "::error::WEB008 doit centraliser les écritures via commitWebMutation/writeBatch."
            exit 1
          fi

          echo "WEB008 : édition activité interopérable sur les trois plateformes validée."

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./web"

      - name: Publier SPORT Web · WEB008
        id: deployment
        uses: actions/deploy-pages@v4
