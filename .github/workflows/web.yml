name: Publier SPORT Web · WEB006

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      - "docs/releases/WEB006.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "sport-web-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Valider WEB006
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js

          grep -Fq "WEB006 · INTEROP · Comfortaa" web/index.html
          grep -Fq 'family=Comfortaa' web/index.html
          grep -Fq 'z-index: 4000' web/styles.css
          grep -Fq 'isolation: isolate' web/styles.css

          # Interop : WEB006 ouvre volontairement des écritures contrôlées.
          grep -Fq 'writeBatch' web/app.js
          grep -Fq 'onSnapshot' web/app.js
          grep -Fq '"changes"' web/app.js
          grep -Fq 'function commitWebMutation' web/app.js
          grep -Fq 'function saveCurrentActivityEdits' web/app.js
          grep -Fq 'function setLandmarkOccurrence' web/app.js
          grep -Fq 'function startInteropWatch' web/app.js
          grep -Fq 'webVersion: "WEB006"' web/app.js
          grep -Fq 'table: "activities"' web/app.js
          grep -Fq 'table: "activity_landmarks"' web/app.js

          # Pas d'API d'écriture directe dispersée : tout passe par le batch contrôlé.
          if grep -Eq '\b(setDoc|addDoc|updateDoc|deleteDoc|runTransaction)\b' web/app.js; then
            echo "::error::WEB006 doit centraliser les écritures dans commitWebMutation/writeBatch."
            exit 1
          fi

          echo "WEB006 : interop Web ↔ Android + CARTO+ + Comfortaa validés."

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./web"

      - name: Publier SPORT Web · WEB006
        id: deployment
        uses: actions/deploy-pages@v4
