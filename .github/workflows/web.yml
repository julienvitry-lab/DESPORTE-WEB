name: Publier SPORT Web · WEB004

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      - "docs/releases/WEB004.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "sport-web-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Valider WEB004
        shell: bash
        run: |
          set -euo pipefail

          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js

          grep -Fq "WEB004 · cartographie + profil" web/index.html
          grep -Fq 'const PAGE_SIZE = 250' web/app.js
          grep -Fq 'function renderDetail(activity)' web/app.js
          grep -Fq 'function moveDetail(delta)' web/app.js
          grep -Fq 'function renderCartography(activity)' web/app.js
          grep -Fq '"activity_routes"' web/app.js
          grep -Fq 'leaflet@1.9.4' web/index.html
          grep -Fq 'Carte et profil altimétrique' web/index.html
          grep -Fq 'Données techniques Firestore' web/index.html
          grep -Fq 'projectId: "sport-505813"' web/app.js

          if grep -Eq '\b(setDoc|addDoc|updateDoc|deleteDoc|writeBatch|runTransaction)\b' web/app.js; then
            echo "::error::WEB004 doit rester strictement en lecture seule."
            exit 1
          fi

          echo "WEB004 : fiche activité + carte Leaflet + profil altimétrique + navigation, lecture seule validés."

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./web"

      - name: Publier SPORT Web · WEB004
        id: deployment
        uses: actions/deploy-pages@v4
