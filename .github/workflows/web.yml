name: Publier SPORT Web · WEB030

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      - "docs/releases/WEB030.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "sport-web-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Valider WEB030
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js

          grep -Fq "WEB018 · SYNCHEALTH001" web/index.html
          grep -Fq "Santé de la synchronisation" web/index.html
          grep -Fq "syncHealthRetryButton" web/index.html

          grep -Fq 'WEB_PENDING_MUTATIONS_KEY' web/app.js
          grep -Fq 'function startSyncHealthWatch' web/app.js
          grep -Fq 'function publishWebHealth' web/app.js
          grep -Fq 'function flushPendingWebMutations' web/app.js
          grep -Fq 'function commitWebMutationOnline' web/app.js
          grep -Fq '"sync_health"' web/app.js
          grep -Fq 'webVersion: "WEB030"' web/app.js

          # WEB022 · WEBCARTO007.
          grep -Fq "WEB020 · WEBCARTO005" web/index.html
          grep -Fq 'mapRouteModeSelect' web/index.html
          grep -Fq 'mapKmMarkersToggle' web/index.html
          grep -Fq 'mapRecenterButton' web/index.html
          grep -Fq 'function calculateRouteGrades' web/app.js
          grep -Fq 'function redrawRouteOverlay' web/app.js
          grep -Fq 'function renderKmMarkers' web/app.js
          grep -Fq 'function recenterActivityMap' web/app.js
          grep -Fq 'routeAnalysis' web/index.html
          grep -Fq 'routeSegmentList' web/index.html
          grep -Fq 'function detectRouteSegments' web/app.js
          grep -Fq 'function renderRouteAnalysis' web/app.js
          grep -Fq 'function selectRouteSegment' web/app.js
          grep -Fq 'function clearRouteSegmentSelection' web/app.js
          grep -Fq '.route-segment-card' web/styles.css
          grep -Fq '.profile-segment-highlight' web/styles.css
          grep -Fq '.route-km-icon' web/styles.css
          grep -Fq '.map-slope-legend' web/styles.css

          # Héritages critiques.
          grep -Fq 'function trashActivityFromWeb' web/app.js
          grep -Fq 'function startSyncHistoryWatch' web/app.js
          grep -Fq 'function detectSyncConflicts' web/app.js
          grep -Fq 'function loadWebDashboard' web/app.js
          grep -Fq 'function renderDashboardChart' web/app.js
          grep -Fq 'function loadPersonalSyncData' web/app.js

          grep -Fq 'family=Comfortaa' web/index.html
          grep -Fq 'z-index: 4000' web/styles.css

          grep -Fq 'routeSegmentDetail' web/index.html
          grep -Fq 'segmentGradeAnalysis' web/app.js
          grep -Fq '.route-grade-band' web/styles.css
          grep -Fq "WEB020 · WEBCARTO005" web/index.html
          grep -Fq 'routeKmAnalysisList' web/index.html
          grep -Fq 'function buildKilometerSegments' web/app.js
          grep -Fq 'function renderKilometerAnalysis' web/app.js
          grep -Fq 'function selectKilometerSegment' web/app.js
          grep -Fq '.route-km-card' web/styles.css
          grep -Fq 'WEB022 · WEBCARTO007' web/index.html
          grep -Fq 'climbSubsegmentsList' web/index.html
          grep -Fq 'function buildClimbSubsegments' web/app.js
          grep -Fq 'function renderClimbSubsegments' web/app.js
          grep -Fq 'function selectClimbSubsegment' web/app.js
          grep -Fq '.climb-subsegment-card' web/styles.css
          grep -Fq 'WEB022 · WEBCARTO007' web/index.html
          grep -Fq 'routeComparisonSelect' web/index.html
          grep -Fq 'function compareSelectedActivity' web/app.js
          grep -Fq 'function drawComparisonRouteLayer' web/app.js
          grep -Fq 'profile-comparison-line' web/styles.css
          grep -Fq 'WEB023 · WEBCARTO008' web/index.html
          grep -Fq 'globalActivityMap' web/index.html
          grep -Fq 'globalMapAllButton' web/index.html
          grep -Fq 'function renderGlobalActivityMap' web/app.js
          grep -Fq 'function loadGlobalRoute' web/app.js
          grep -Fq 'function mapWithConcurrency' web/app.js
          grep -Fq '.global-activity-map' web/styles.css
          grep -Fq 'WEB024 · WEBANALYSE001' web/index.html
          grep -Fq 'performanceTerrainMetrics' web/index.html
          grep -Fq 'function routeTerrainAnalysis' web/app.js
          grep -Fq 'function benchmarkPerformance' web/app.js
          grep -Fq 'function renderPerformanceTerrainAnalysis' web/app.js
          grep -Fq '.performance-terrain-analysis' web/styles.css
          grep -Fq 'WEB025 · WEBREPERES001' web/index.html
          grep -Fq 'recurringLandmarksList' web/index.html
          grep -Fq 'function recurringClimbsMatch' web/app.js
          grep -Fq 'function analyzeRecurringClimbsForCurrentActivity' web/app.js
          grep -Fq 'function renderRecurringLandmarkHistory' web/app.js
          grep -Fq '.recurring-landmarks-analysis' web/styles.css
          grep -Fq '<option value="topo" selected>OpenTopoMap</option>' web/index.html
          grep -Fq 'const preferredLayer = ui.mapLayerSelect.value || "topo";' web/app.js
          grep -Fq 'activityBaseLayers[preferredLayer] || activityBaseLayers.topo' web/app.js
          grep -Fq 'font: 13px "Comfortaa"' web/styles.css
          grep -Fq 'WEB027 · WEBANALYSE002' web/index.html
          grep -Fq 'performanceProgressionSummary' web/index.html
          grep -Fq 'function progressionCohort' web/app.js
          grep -Fq 'function progressionWindow' web/app.js
          grep -Fq 'function renderPerformanceProgression' web/app.js
          grep -Fq '.performance-progression' web/styles.css
          grep -Fq 'WEB028 · WEBREPERES002' web/index.html
          grep -Fq 'function nextAscensionLandmarkCode' web/app.js
          grep -Fq 'function createOfficialLandmarkFromRecurringClimb' web/app.js
          grep -Fq 'Valider comme repère' web/app.js
          grep -Fq 'table: "personal_landmarks"' web/app.js
          grep -Fq 'setLandmarkOccurrence(target, row.code, 1)' web/app.js
          grep -Fq '.recurring-climb-actions' web/styles.css
          grep -Fq 'WEB029 · WEBCARTO010' web/index.html
          grep -Fq 'globalMapModeSelect' web/index.html
          grep -Fq 'globalMapYearSelect' web/index.html
          grep -Fq 'function buildDensityCells' web/app.js
          grep -Fq 'function renderGlobalDensity' web/app.js
          grep -Fq 'densityTileForPoint' web/app.js
          grep -Fq '.global-map-density-controls' web/styles.css
          grep -Fq 'WEB030 · WEBCARTO011' web/index.html
          grep -Fq 'globalMapDensityZoomSelect' web/index.html
          grep -Fq 'globalHotspotExplorer' web/index.html
          grep -Fq 'function renderGlobalHotspotExplorer' web/app.js
          grep -Fq 'function hotspotDominantSport' web/app.js
          grep -Fq 'ui.globalMapDensityZoomSelect?.value || 17' web/app.js
          grep -Fq '.global-hotspot-explorer' web/styles.css
          echo "WEB030 : WEBCARTO011 + WEBCARTO010 + WEBREPERES002 + WEBANALYSE002 + WEBCARTO009 + WEBREPERES001 + WEBANALYSE001 + WEBCARTO008 + WEBCARTO007 + WEBCARTO006 + WEBCARTO005 + WEBCARTO004 + WEBCARTO003 + WEBCARTO002 + SYNCHEALTH001 validés."

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./web"

      - name: Publier SPORT Web · WEB030
        id: deployment
        uses: actions/deploy-pages@v4
