name: Publier SPORT Web · WEB043

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "functions/**"
      - "firebase.functions.json"
      - "scripts/deploy_strava_backend.sh"
      - ".github/workflows/web.yml"
      - "docs/releases/WEB043.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "sport-web-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Valider SPORT Web courant
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================================"
          echo "VALIDATION SPORT WEB COURANT"
          echo "======================================================"

          req_file() {
            local file="$1"
            local label="$2"
            if [ -f "$file" ]; then
              echo "✓ $label"
            else
              echo "❌ $label : $file absent"
              exit 40
            fi
          }

          req() {
            local file="$1"
            local token="$2"
            local label="$3"

            if grep -Fq "$token" "$file"; then
              echo "✓ $label"
            else
              echo "❌ $label"
              echo "  Fichier : $file"
              echo "  Token   : $token"
              exit 41
            fi
          }

          req_re() {
            local file="$1"
            local regex="$2"
            local label="$3"

            if grep -Eq "$regex" "$file"; then
              echo "✓ $label"
            else
              echo "❌ $label"
              echo "  Fichier : $file"
              echo "  Regex   : $regex"
              exit 42
            fi
          }

          req_file web/index.html "web/index.html"
          req_file web/styles.css "web/styles.css"
          req_file web/app.js "web/app.js"

          node --check web/app.js
          echo "✓ Syntaxe web/app.js"

          if [ -f functions/index.js ]; then
            node --check functions/index.js
            echo "✓ Syntaxe functions/index.js"
          fi

          if [ -f scripts/deploy_strava_backend.sh ]; then
            bash -n scripts/deploy_strava_backend.sh
            echo "✓ Syntaxe deploy_strava_backend.sh"
          fi

          # Socle fonctionnel durable.
          req web/app.js 'function renderActivities()' 'Répertoire'
          req web/app.js 'function renderDetail(activity)' 'Détail activité'
          req web/app.js 'function renderCartography(activity)' 'Cartographie'
          req web/app.js 'await signInWithPopup(auth, provider);' 'Authentification Google'
          req web/app.js 'function commitWebMutationOnline' 'Mutations Firebase'

          # Acquis fonctionnels récents : on contrôle les fonctions,
          # pas le numéro de cache-bust de la dernière version.
          req web/app.js 'function web060MovingTimeMs(activity)' 'MOVINGTIME001'
          req web/app.js 'function web061RenderSingleMetricRow(activity)' 'Détail mono-ligne'
          req web/app.js 'async function web063PersistMovingAudit(activity, audit)' 'MOVINGCACHE003'
          req web/app.js 'function web064EnsureDirectDetailTop()' 'Structure toolbar détail'
          req web/app.js 'function web065EnsureToolbarGroups()' 'Toolbar flex WEB065'
          req web/app.js 'function web065ReserveStickyOffset()' 'Réservation sticky WEB065'

          # Cache-bust présent, mais sans exiger un numéro de version précis.
          req_re web/index.html 'src="\./app\.js\?v=[^"]+"' 'Cache-bust app.js'

          # Garde-fou performance.
          MUT="$(grep -c 'new MutationObserver' web/app.js || true)"
          if [ "$MUT" != "0" ]; then
            echo "❌ MutationObserver = $MUT"
            exit 43
          fi
          echo "✓ MutationObserver = 0"

          echo "======================================================"
          echo "✅ VALIDATION SPORT WEB COURANT OK"
          echo "======================================================"
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./web"

      - name: Publier SPORT Web · WEB043
        id: deployment
        uses: actions/deploy-pages@v4
