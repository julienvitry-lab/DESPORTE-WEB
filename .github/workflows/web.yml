name: Publier SPORT Web · WEB043

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "functions/**"
      - "firebase.functions.json"
      - "scripts/deploy_strava_backend.sh"
      - ".github/workflows/web.yml"
      - "docs/releases/WEB043.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "sport-web-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Valider SPORT Web courant
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================================"
          echo "VALIDATION SPORT WEB COURANT"
          echo "======================================================"

          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js

          node --check web/app.js

          if [ -f functions/index.js ]; then
            node --check functions/index.js
          fi

          if [ -f scripts/deploy_strava_backend.sh ]; then
            bash -n scripts/deploy_strava_backend.sh
          fi

          # Socle fonctionnel actuel.
          grep -Fq 'function renderActivities()' web/app.js
          grep -Fq 'function renderDetail(activity)' web/app.js
          grep -Fq 'function renderCartography(activity)' web/app.js
          grep -Fq 'await signInWithPopup(auth, provider);' web/app.js
          grep -Fq 'function commitWebMutationOnline' web/app.js

          # Acquis récents à préserver.
          grep -Fq 'function web060MovingTimeMs(activity)' web/app.js
          grep -Fq 'function web061RenderSingleMetricRow(activity)' web/app.js
          grep -Fq 'async function web063PersistMovingAudit(activity, audit)' web/app.js
          grep -Fq 'function web064EnsureDirectDetailTop()' web/app.js
          grep -Fq 'WEB064-DETAILTOP020-STRUCTURAL' web/index.html

          # Garde-fou performance.
          test "$(grep -c 'new MutationObserver' web/app.js || true)" = "0"

          # Le workflow ne doit plus imposer des éléments UI historiques
          # supprimés volontairement (découpe manuelle, ancien texte GAP, etc.).
          echo "✓ Fichiers Web présents"
          echo "✓ Syntaxe JavaScript valide"
          echo "✓ Auth conservée"
          echo "✓ Répertoire / détail / cartographie conservés"
          echo "✓ MOVINGTIME001 conservé"
          echo "✓ Mono-ligne détail conservée"
          echo "✓ MOVINGCACHE003 conservé"
          echo "✓ DETAILTOP020 conservé"
          echo "✓ MutationObserver = 0"

          echo "======================================================"
          echo "✅ VALIDATION SPORT WEB COURANT OK"
          echo "======================================================"
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./web"

      - name: Publier SPORT Web · WEB043
        id: deployment
        uses: actions/deploy-pages@v4
