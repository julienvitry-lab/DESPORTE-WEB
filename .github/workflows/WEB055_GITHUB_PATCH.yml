name: WEB055 - WEBHOME003 WEBSTATUS002 WEBUX009

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Valider la base acquise
        shell: bash
        run: |
          set -euo pipefail

          echo "=== BASE ==="
          git log -1 --oneline

          node --check web/app.js

          grep -Fq 'authDomain: "sport-505813.firebaseapp.com"' web/app.js
          grep -Fq 'await signInWithPopup(auth, provider);' web/app.js
          ! grep -Fq 'await signInWithRedirect(auth, provider);' web/app.js
          grep -Fq 'queueMicrotask(() => installEquipmentMappingEditorWeb050());' web/app.js
          grep -Fq 'function renderUnifiedConnectionBadgeWeb051()' web/app.js
          grep -Fq '["appearance","Apparence"]' web/app.js
          grep -Fq 'sport-running-c1-exact.png' web/app.js
          grep -Fq 'sport-bike-v1-exact.png' web/app.js
          grep -Fq 'const EQUIPMENT_PROFILES_WEB053' web/app.js
          ! grep -Fq 'async async function' web/app.js

          MUT="$(grep -c 'new MutationObserver' web/app.js || true)"
          test "$MUT" = "0"

          if [ -f scripts/contracts/validate_web_golden.mjs ]; then
            node scripts/contracts/validate_web_golden.mjs
          fi

          echo "✓ Base WEB053+ reconnue"
          echo "✓ Auth popup reconnue"
          echo "✓ TDZFIX001 reconnu"
          echo "✓ C1/V1 exacts reconnus"
          echo "✓ Plus > Apparence reconnu"

      - name: Empreinte Auth avant WEB055
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/web055_authhash.mjs <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";

          const s = fs.readFileSync("web/app.js", "utf8");

          function extractBalanced(startMarker) {
            const start = s.indexOf(startMarker);
            if (start < 0) throw new Error("Marqueur auth introuvable : " + startMarker);
            const brace = s.indexOf("{", start);
            if (brace < 0) throw new Error("Accolade introuvable");

            let depth = 0, quote = null, escape = false;
            for (let i = brace; i < s.length; i++) {
              const ch = s[i];
              if (quote) {
                if (escape) escape = false;
                else if (ch === "\\") escape = true;
                else if (ch === quote) quote = null;
                continue;
              }
              if (ch === '"' || ch === "'" || ch === "`") {
                quote = ch;
                continue;
              }
              if (ch === "{") depth++;
              else if (ch === "}") {
                depth--;
                if (depth === 0) return s.slice(start, i + 1);
              }
            }
            throw new Error("Fin bloc introuvable");
          }

          const firebaseStart = s.indexOf("const firebaseConfig");
          const authStart = s.indexOf("const auth =");
          if (firebaseStart < 0 || authStart < firebaseStart) {
            throw new Error("Configuration Firebase introuvable");
          }

          const authLineEndRel = s.slice(authStart).indexOf("\n");
          const authLineEnd = authLineEndRel >= 0 ? authStart + authLineEndRel + 1 : s.length;
          const firebaseBlock = s.slice(firebaseStart, authLineEnd);

          const loginBlock = extractBalanced('ui.loginButton.addEventListener("click", async () =>');
          let observer = extractBalanced("onAuthStateChanged(auth, async (user) =>");

          observer = observer
            .split(/\r?\n/)
            .filter((line) =>
              !line.includes("ui.authState.") &&
              !line.includes("renderUnifiedConnectionBadgeWeb05")
            )
            .join("\n");

          const payload = [firebaseBlock, loginBlock, observer].join("\n---AUTH-CORE---\n");
          process.stdout.write(crypto.createHash("sha256").update(payload).digest("hex"));
          NODE

          AUTH_BEFORE="$(node /tmp/web055_authhash.mjs)"
          POPUP_BEFORE="$(grep -c 'signInWithPopup' web/app.js || true)"

          echo "AUTH_BEFORE=$AUTH_BEFORE" >> "$GITHUB_ENV"
          echo "POPUP_BEFORE=$POPUP_BEFORE" >> "$GITHUB_ENV"

          echo "AUTH CORE SHA256 AVANT : $AUTH_BEFORE"
          echo "signInWithPopup AVANT   : $POPUP_BEFORE"

      - name: Preparer moteur WEB055
        shell: bash
        run: |
          set -euo pipefail

          echo '' | base64 -d > /tmp/web055_fragment.js
          echo '' | base64 -d > /tmp/apply_web055.mjs

          node --check /tmp/web055_fragment.js
          node --check /tmp/apply_web055.mjs

          echo "✓ Fragment WEBHOME003 valide"
          echo "✓ Patcher WEB055 valide"

      - name: Appliquer WEB055
        shell: bash
        run: |
          set -euo pipefail

          WEB055_FRAGMENT=/tmp/web055_fragment.js node /tmp/apply_web055.mjs

          node --check web/app.js
          npx --yes acorn@8.15.0 --ecma2022 --module web/app.js >/dev/null

          echo "✓ WEB055 applique"

      - name: Verifier non-regression Auth
        shell: bash
        run: |
          set -euo pipefail

          AUTH_AFTER="$(node /tmp/web055_authhash.mjs)"
          POPUP_AFTER="$(grep -c 'signInWithPopup' web/app.js || true)"

          echo "AUTH CORE SHA256 AVANT : $AUTH_BEFORE"
          echo "AUTH CORE SHA256 APRES : $AUTH_AFTER"
          echo "signInWithPopup AVANT   : $POPUP_BEFORE"
          echo "signInWithPopup APRES   : $POPUP_AFTER"

          test "$AUTH_BEFORE" = "$AUTH_AFTER"
          test "$POPUP_BEFORE" = "$POPUP_AFTER"

          echo "✓ AUTHENTIFICATION MECANIQUE STRICTEMENT IDENTIQUE"

      - name: Contrats WEB055
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'function renderUnifiedConnectionBadgeWeb055()' web/app.js
          ! grep -Fq 'Firebase connecté' web/app.js web/index.html

          grep -Fq 'function installWeb055HomeLayout()' web/app.js
          grep -Fq 'function renderWeb055Periods()' web/app.js
          grep -Fq 'function renderWeb055Goal()' web/app.js
          grep -Fq 'function renderWeb055Regularity()' web/app.js
          grep -Fq 'function renderWeb055Comparison()' web/app.js
          grep -Fq 'async function loadWebDashboardLegacyWeb055()' web/app.js
          grep -Fq 'async function loadWebDashboard()' web/app.js

          grep -Fq 'const EQUIPMENT_PROFILES_WEB053' web/app.js
          grep -Fq 'queueMicrotask(() => installEquipmentMappingEditorWeb050());' web/app.js
          grep -Fq '["appearance","Apparence"]' web/app.js
          grep -Fq 'sport-running-c1-exact.png' web/app.js
          grep -Fq 'sport-bike-v1-exact.png' web/app.js

          ! grep -Fq 'async async function' web/app.js

          MUT="$(grep -c 'new MutationObserver' web/app.js || true)"
          test "$MUT" = "0"

          if [ -f scripts/contracts/validate_web_golden.mjs ]; then
            node scripts/contracts/validate_web_golden.mjs
          fi

          git diff --check

          echo "=============================================="
          echo "WEB055 CONTRATS : OK"
          echo "AUTH CORE                  : IDENTIQUE"
          echo "SIGNINWITHPOPUP             : IDENTIQUE"
          echo "STATUT 2 ETATS UNIQUEMENT   : OK"
          echo "FIREBASE CONNECTE SUPPRIME  : OK"
          echo "COURSE PAR DEFAUT           : OK"
          echo "4 LIGNES SIMULTANEES        : OK"
          echo "DISTANCE / TEMPS / D+       : OK"
          echo "CHARGE / GAP                : OK"
          echo "OBJECTIF VERT / ROUGE       : OK"
          echo "RYTHME KM/JOUR              : OK"
          echo "REGULARITE > 10 KM          : OK"
          echo "COMPARAISON N / N-1         : OK"
          echo "TRI ACTIVITES HORIZONTAL    : OK"
          echo "WEB053                      : CONSERVE"
          echo "TDZFIX001                    : CONSERVE"
          echo "PLUS > APPARENCE             : CONSERVE"
          echo "C1/V1 EXACTS                : CONSERVES"
          echo "=============================================="

      - name: Ajouter release et deploiement Cloud Shell
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p docs/releases scripts

          cat > docs/releases/WEB055.md <<'EOF'
          # WEB055 · WEBHOME003 / WEBSTATUS002 / WEBUX009

          ## WEBSTATUS002
          - badge unique `Connecté` / `Non connecté`
          - aucun état intermédiaire `Firebase connecté`
          - `Connecté` exige Google/Auth + Firestore + Strava + réseau
          - mécanisme `signInWithPopup` inchangé

          ## WEBHOME003
          - Course à pied par défaut
          - suppression visuelle du gros titre Accueil et du bouton Actualiser
          - rafraîchissement automatique au changement d'onglet
          - 4 lignes simultanées : Semaine / Mois / Année / Total
          - Distance / Temps H:M:S / D+ / Charge / GAP
          - aucun nombre d'activités
          - anciens encarts Tendances / Activités / Matériel masqués
          - objectif annuel : réalisé vert, retard au cap théorique rouge, reste neutre
          - cap théorique du jour, avance/retard, reste annuel, km/jour jusqu'au 31 décembre
          - Régularité : jours > seuil, 10 km par défaut, série record et historique annuel
          - comparaison cumulative année N / N-1 : Distance, D+, Temps ou Charge

          ## WEBUX009
          - `Tri des activités` reste horizontal
          - aucune rotation ni writing-mode vertical

          WEB053, TDZFIX001, Plus > Apparence, C1/V1 exacts et WEBPERF001 sont conservés.
          EOF

          cat > firebase.hosting.web055.json <<'EOF'
          {
            "hosting": {
              "site": "sport-505813",
              "public": "web",
              "ignore": [
                "firebase.json",
                "**/.*",
                "**/node_modules/**"
              ],
              "headers": [
                {
                  "source": "**",
                  "headers": [
                    {
                      "key": "Cache-Control",
                      "value": "no-cache, no-store, must-revalidate"
                    }
                  ]
                }
              ]
            }
          }
          EOF

          cat > scripts/deploy_web055_cloudshell.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          echo "=== WEB055 · FIREBASE HOSTING ==="

          git fetch origin
          git checkout main
          git reset --hard origin/main

          node --check web/app.js
          grep -Fq 'WEB055-WEBHOME003-WEBSTATUS002-WEBUX009' web/index.html
          grep -Fq 'function renderUnifiedConnectionBadgeWeb055()' web/app.js
          grep -Fq 'function installWeb055HomeLayout()' web/app.js
          ! grep -Fq 'Firebase connecté' web/app.js web/index.html

          npx --yes firebase-tools@15.28.2 deploy             --only hosting             --project sport-505813             --config firebase.hosting.web055.json

          STAMP="$(date +%s)"

          curl -fsSL "https://sport-505813.web.app/app.js?web055=$STAMP" > /tmp/web055-live-app.js
          curl -fsSL "https://sport-505813.web.app/?web055=$STAMP" > /tmp/web055-live-index.html

          grep -Fq 'function renderUnifiedConnectionBadgeWeb055()' /tmp/web055-live-app.js
          grep -Fq 'function installWeb055HomeLayout()' /tmp/web055-live-app.js
          grep -Fq 'renderWeb055Regularity' /tmp/web055-live-app.js
          grep -Fq 'renderWeb055Comparison' /tmp/web055-live-app.js
          ! grep -Fq 'Firebase connecté' /tmp/web055-live-app.js /tmp/web055-live-index.html

          echo
          echo "✅ WEB055 DEPLOYE SUR FIREBASE HOSTING"
          echo "https://sport-505813.web.app"
          EOF

          chmod +x scripts/deploy_web055_cloudshell.sh

      - name: Commit et push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             web/app.js             web/index.html             docs/releases/WEB055.md             firebase.hosting.web055.json             scripts/deploy_web055_cloudshell.sh

          if git diff --cached --quiet; then
            echo "WEB055 deja applique : aucun commit necessaire."
            exit 0
          fi

          git commit -m "WEB055 WEBHOME003 WEBSTATUS002 WEBUX009 consolide accueil DESPORTE"
          git push origin HEAD:main

          echo
          echo "✅ WEB055 pousse sur main"
          echo "Commit : $(git rev-parse --short HEAD)"
